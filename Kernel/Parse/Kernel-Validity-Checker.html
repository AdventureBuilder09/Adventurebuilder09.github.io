<!DOCTYPE html>
<html>
<head>
	<title>Deck Checker</title>
	<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
	<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
<!-- Latest update -->
<div id="build-status">Checking sync status...</div>
<script>
  fetch('https://api.github.com/repos/Adventurebuilder09/adventurebuilder09.github.io/commits/main')
    .then(response => response.json())
    .then(data => {
      const latestCommitDate = new Date(data.commit.committer.date);
      document.getElementById('build-status').innerText = 
        `Synced with GitHub commit from: ${latestCommitDate.toLocaleString()}`;
    })
    .catch(error => {
      document.getElementById('build-status').innerText = 'Could not get status.';
    });
</script>
<br>
<!-- Simply display the live, self-updating image badge directly -->
<img src="" alt="Workflow Status">
<div class="badge-container">
    <h4>Live Deployment Monitor</h4>
    <!-- The script will populate the src attribute here -->
    <img id="live-workflow-badge" src="" alt="Checking workflow status...">
</div>

<script>
    function refreshBadge() {
        const badgeImg = document.getElementById('live-workflow-badge');
        
        // Use a timestamp to destroy the browser's attempt to cache the image
        const cacheBuster = new Date().getTime();
        
        // Construct the official URL with the anti-cache parameter attached
        const liveBadgeUrl = `https://github.com/AdventureBuilder09/Adventurebuilder09.github.io/actions/workflows/pages-build-deployment/badge.svg?v=${cacheBuster}`;
        
        // Update the image element
        badgeImg.src = liveBadgeUrl;
    }

    // 1. Run immediately when the user lands on the page
    refreshBadge();

    // 2. Refresh the image automatically every 10 seconds to catch live builds
    setInterval(refreshBadge, 10000); 
</script>
<py-config>
    {
        "files" = {
            "./localparse.py": "./localparse.py",
            "./displayCard.py": "./displayCard.py"
        },
        "packages": ["js", "re", "json"]
    }
</py-config>

        <h2>Decklist</h2>
        <p>Paste your decklist below, then hit Score to check the score (it might take a second)</p>

        <div>
            <label for="input-text"><strong>Decklist:</strong></label><br>
            <textarea id="input-text" rows="10" style="width: 100%; margin-top: 8px;" placeholder="1 Black Lotus..."></textarea>
        </div>

        <button py-click="process_text" style="margin-top: 12px; padding: 8px 16px; cursor: pointer;">Score</button>

        <div style="margin-top: 20px;">
            <label for="output-text"><strong>Processed Output:</strong></label><br>
            <textarea id="output-text" rows="10" style="width: 100%; margin-top: 8px;" readonly placeholder="Processed result will appear here..."></textarea>
        </div>

<script type="py" src="localparse.py" defer></script>

</body>
</html>
