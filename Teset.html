<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Text Processor</title>
    <!-- Link to PyScript CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <main style="max-width: 800px; margin: 40px auto; font-family: sans-serif; padding: 0 20px;">
        <h2>PyScript Text Processor</h2>
        <p>Paste up to 200 lines of text below. When you click process, Python will map the text using a JSON configuration file.</p>

        <div>
            <label for="input-text"><strong>Input Text:</strong></label><br>
            <textarea id="input-text" rows="10" style="width: 100%; margin-top: 8px;" placeholder="Paste text here..."></textarea>
        </div>

        <button py-click="process_text" style="margin-top: 12px; padding: 8px 16px; cursor: pointer;">Process Text</button>

        <div style="margin-top: 20px;">
            <label for="output-text"><strong>Processed Output:</strong></label><br>
            <textarea id="output-text" rows="10" style="width: 100%; margin-top: 8px;" readonly placeholder="Processed result will appear here..."></textarea>
        </div>
    </main>

    <!-- Python code block -->
    <script type="py" config='{"files": {"config.json": "./config.json"}}'>
        import js
        import json
        async def process_text(event):
            # 1. Grab input text from the textarea
            raw_text = js.document.getElementById("input-text").value
            
            # 2. Load the JSON configuration file (pre-fetched via config)
            try:
                with open("config.json", "r") as f:
                    config_data = json.load(f)
            except Exception as e:
                js.document.getElementById("output-text").value = f"Error loading JSON: {e}"
                return

            # 3. Process lines (example: uppercase words or apply replacement rules from JSON)
            lines = raw_text.splitlines()
            processed_lines = []
            
            replacement_map = config_data.get("replacements", {})

            for line in lines:
                # Apply simple custom processing rules defined in JSON
                current_line = line
                for target, replacement in replacement_map.items():
                    current_line = current_line.replace(target, replacement)
                processed_lines.append(current_line)

            # 4. Join back and display in the output textarea
            final_output = "\n".join(processed_lines)
            js.document.getElementById("output-text").value = final_output
    </script>
</body>
</html>
